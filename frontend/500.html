<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>500 Server Error - Adventist General Hospital</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/main.css" />
    <link rel="stylesheet" href="css/status-pages.css" />
    <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>

    <!-- ============================================ -->
    <!-- 500 PAGE                                  -->
    <!-- ============================================ -->
    <section class="status-page">
        <div class="container">
            <div class="status-wrapper">
                <div class="status-code">500</div>
                <div class="status-icon">
                    <i class="fas fa-exclamation-triangle"></i>
                </div>
                <h1>Server Error</h1>
                <p>Something went wrong on our end. We're working to fix it. Please try again later.</p>
                
                <div class="status-actions">
                    <a href="index.html" class="btn btn-primary">
                        <i class="fas fa-home"></i> Back to Home
                    </a>
                    <a href="javascript:location.reload()" class="btn btn-outline-primary">
                        <i class="fas fa-redo"></i> Try Again
                    </a>
                </div>

                <div class="status-update">
                    <p>For immediate assistance, please contact our support team:</p>
                    <a href="tel:+251911234567" class="emergency-phone">
                        <i class="fas fa-phone"></i> +251-911-234-567
                    </a>
                </div>
            </div>
        </div>
    </section>
</body>
  </html>
