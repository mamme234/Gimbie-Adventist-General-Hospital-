<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Under Maintenance - Adventist General Hospital</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/main.css" />
    <link rel="stylesheet" href="css/status-pages.css" />
    <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>

    <!-- ============================================ -->
    <!-- MAINTENANCE PAGE                          -->
    <!-- ============================================ -->
    <section class="status-page">
        <div class="container">
            <div class="status-wrapper">
                <div class="status-icon">
                    <i class="fas fa-tools"></i>
                </div>
                <h1>Under Maintenance</h1>
                <p>We're currently performing scheduled maintenance. We'll be back shortly.</p>
                
                <div class="maintenance-details">
                    <div class="maintenance-info">
                        <i class="fas fa-clock"></i>
                        <span>Estimated downtime: <strong>2-4 hours</strong></span>
                    </div>
                    <div class="maintenance-info">
                        <i class="fas fa-calendar"></i>
                        <span>Last updated: <strong>Today at 10:00 AM</strong></span>
                    </div>
                </div>

                <div class="status-actions">
                    <a href="index.html" class="btn btn-primary">
                        <i class="fas fa-home"></i> Back to Home
                    </a>
                    <a href="contact.html" class="btn btn-outline-primary">
                        <i class="fas fa-envelope"></i> Contact Us
                    </a>
                </div>

                <div class="status-update">
                    <p>For urgent medical assistance, please call:</p>
                    <a href="tel:+251911234567" class="emergency-phone">
                        <i class="fas fa-phone"></i> +251-911-234-567
                    </a>
                </div>
            </div>
        </div>
    </section>
</body>
</html>
