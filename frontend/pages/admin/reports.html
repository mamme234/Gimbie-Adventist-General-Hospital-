<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reports - Gimbie Adventist General Hospital</title>
    <link rel="icon" href="/assets/images/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="/src/css/style.css" />
    <link rel="stylesheet" href="/src/css/admin.css" />
    <link rel="stylesheet" href="/src/css/responsive.css" />
</head>
<body data-page="reports">
    <div class="admin-wrapper">
        <aside class="admin-sidebar" id="adminSidebar">
            <div class="logo">
                <a href="/pages/admin/dashboard.html">
                    <img src="/assets/images/logo.png" alt="Gimbie Adventist" class="logo__img" />
                    <div class="logo__text">
                        <span class="logo__name">Gimbie Adventist</span>
                        <span class="logo__tag">Admin Panel</span>
                    </div>
                </a>
            </div>
            <nav class="admin-sidebar__nav">
                <ul>
                    <li><a href="/pages/admin/dashboard.html"><i class="fas fa-th-large"></i> Dashboard</a></li>
                    <li><a href="/pages/admin/patients.html"><i class="fas fa-users"></i> Patients</a></li>
                    <li><a href="/pages/admin/doctors.html"><i class="fas fa-user-md"></i> Doctors</a></li>
                    <li><a href="/pages/admin/staff.html"><i class="fas fa-user-tie"></i> Staff</a></li>
                    <li><a href="/pages/admin/appointments.html"><i class="fas fa-calendar-check"></i> Appointments</a></li>
                    <li><a href="/pages/admin/billing.html"><i class="fas fa-file-invoice-dollar"></i> Billing</a></li>
                    <li><a href="/pages/admin/pharmacy.html"><i class="fas fa-pills"></i> Pharmacy</a></li>
                    <li><a href="/pages/admin/laboratory.html"><i class="fas fa-microscope"></i> Laboratory</a></li>
                    <li><a href="/pages/admin/radiology.html"><i class="fas fa-x-ray"></i> Radiology</a></li>
                    <li><a href="/pages/admin/inventory.html"><i class="fas fa-boxes"></i> Inventory</a></li>
                    <li><a href="/pages/admin/reports.html" class="active"><i class="fas fa-chart-bar"></i> Reports</a></li>
                    <li><a href="/pages/admin/settings.html"><i class="fas fa-cog"></i> Settings</a></li>
                </ul>
            </nav>
        </aside>

        <main class="admin-main">
            <div class="admin-topbar">
                <div class="admin-topbar__title">
                    <h1>Reports & Analytics</h1>
                    <p>View hospital statistics and reports</p>
                </div>
                <div class="admin-topbar__actions">
                    <button class="btn btn--primary" onclick="exportPDF()"><i class="fas fa-file-pdf"></i> Export PDF</button>
                    <button class="btn btn--outline" onclick="exportExcel()"><i class="fas fa-file-excel"></i> Export Excel</button>
                </div>
            </div>

            <div id="reportsContainer">
                <!-- Loaded from JS -->
            </div>
        </main>
    </div>

    <script type="module">
        import { loadReports, exportPDF, exportExcel } from '/src/js/reports.js';
        window.exportPDF = exportPDF;
        window.exportExcel = exportExcel;
        document.addEventListener('DOMContentLoaded', () => loadReports());
    </script>
</body>
  </html>
