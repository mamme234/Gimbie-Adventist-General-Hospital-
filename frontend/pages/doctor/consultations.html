<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Consultations - Doctor - Gimbie Adventist General Hospital</title>
    <link rel="icon" href="/assets/images/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="/src/css/style.css" />
    <link rel="stylesheet" href="/src/css/doctor.css" />
    <link rel="stylesheet" href="/src/css/responsive.css" />
</head>
<body>
    <div class="doctor-wrapper">
        <aside class="doctor-sidebar" id="doctorSidebar">
            <div class="profile-section">
                <div class="avatar">D</div>
                <div class="name">Dr. Name</div>
                <div class="specialty">Specialty</div>
            </div>
            <nav class="doctor-sidebar__nav">
                <ul>
                    <li><a href="/pages/doctor/dashboard.html"><i class="fas fa-th-large"></i> Dashboard</a></li>
                    <li><a href="/pages/doctor/appointments.html"><i class="fas fa-calendar-check"></i> Appointments</a></li>
                    <li><a href="/pages/doctor/patients.html"><i class="fas fa-users"></i> Patients</a></li>
                    <li><a href="/pages/doctor/consultations.html" class="active"><i class="fas fa-stethoscope"></i> Consultations</a></li>
                    <li><a href="/pages/doctor/prescriptions.html"><i class="fas fa-prescription"></i> Prescriptions</a></li>
                    <li><a href="/pages/doctor/lab-requests.html"><i class="fas fa-microscope"></i> Lab Requests</a></li>
                    <li><a href="/pages/doctor/profile.html"><i class="fas fa-user"></i> Profile</a></li>
                </ul>
            </nav>
        </aside>

        <main class="doctor-main">
            <div class="doctor-topbar">
                <div class="admin-topbar__title">
                    <h1>Consultations</h1>
                    <p>Start a new consultation</p>
                </div>
            </div>

            <!-- Consultation Form -->
            <div style="background: #fff; padding: 24px; border-radius: var(--radius); box-shadow: var(--shadow); margin-bottom: 24px;">
                <h3 style="margin-bottom: 16px;">New Consultation</h3>
                <form id="consultationForm">
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                        <div class="form-group">
                            <label>Patient</label>
                            <select required>
                                <option value="">Select Patient</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Appointment</label>
                            <select required>
                                <option value="">Select Appointment</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Symptoms</label>
                        <textarea rows="3" placeholder="Describe symptoms..."></textarea>
                    </div>
                    <div class="form-group">
                        <label>Diagnosis</label>
                        <textarea rows="3" placeholder="Enter diagnosis..."></textarea>
                    </div>
                    <div class="form-group">
                        <label>Treatment Plan</label>
                        <textarea rows="3" placeholder="Enter treatment plan..."></textarea>
                    </div>
                    <button type="submit" class="btn btn--primary">Save Consultation</button>
                </form>
            </div>
        </main>
    </div>

    <script type="module">
        import { saveConsultation } from '/src/js/doctor.js';
        document.getElementById('consultationForm')?.addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            await saveConsultation(Object.fromEntries(formData));
        });
    </script>
</body>
</html>
