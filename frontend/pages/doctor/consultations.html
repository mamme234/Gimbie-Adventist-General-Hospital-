<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Consultations - Doctor - Gimbie Adventist General Hospital</title>
    <link rel="icon" href="/assets/images/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="/src/css/style.css" />
    <link rel="stylesheet" href="/src/css/doctor.css" />
    <link rel="stylesheet" href="/src/css/responsive.css" />
</head>
<body>
    <div class="doctor-wrapper">
        <aside class="doctor-sidebar">
            <div class="profile-section">
                <div class="avatar" id="doctorAvatar">D</div>
                <div class="name" id="doctorName">Dr. Name</div>
                <div class="specialty" id="doctorSpecialty">Specialty</div>
            </div>
            <nav class="doctor-sidebar__nav">
                <ul>
                    <li><a href="/pages/doctor/dashboard.html"><i class="fas fa-th-large"></i> Dashboard</a></li>
                    <li><a href="/pages/doctor/appointments.html"><i class="fas fa-calendar-check"></i> Appointments</a></li>
                    <li><a href="/pages/doctor/patients.html"><i class="fas fa-users"></i> Patients</a></li>
                    <li><a href="/pages/doctor/consultations.html" class="active"><i class="fas fa-stethoscope"></i> Consultations</a></li>
                    <li><a href="/pages/doctor/prescriptions.html"><i class="fas fa-prescription-bottle"></i> Prescriptions</a></li>
                    <li><a href="/pages/doctor/lab-requests.html"><i class="fas fa-microscope"></i> Lab Requests</a></li>
                    <li><a href="/pages/doctor/profile.html"><i class="fas fa-user"></i> Profile</a></li>
                    <li class="logout-li">
                        <a href="#" id="sidebarLogoutBtn"><i class="fas fa-sign-out-alt"></i> Logout</a>
                    </li>
                </ul>
            </nav>
        </aside>

        <main class="doctor-main">
            <div class="doctor-topbar">
                <div class="doctor-topbar__title">
                    <h1>Consultations</h1>
                    <p>Conduct patient consultations</p>
                </div>
                <div class="doctor-topbar__actions">
                    <div class="user-profile" id="userProfile">
                        <div class="avatar" id="doctorAvatarSmall">D</div>
                        <span class="name" id="userName">Doctor</span>
                        <i class="fas fa-chevron-down dropdown-icon"></i>
                        <div class="user-dropdown" id="userDropdown">
                            <a href="/pages/doctor/profile.html"><i class="fas fa-user"></i> Profile</a>
                            <a href="/pages/doctor/appointments.html"><i class="fas fa-calendar-check"></i> Appointments</a>
                            <hr />
                            <a href="#" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Logout</a>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Consultation Form -->
            <div class="consultation-form">
                <h3>New Consultation</h3>
                <form id="consultationForm">
                    <div class="form-group">
                        <label>Patient</label>
                        <select id="patientSelect" required>
                            <option value="">Select Patient</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Appointment</label>
                        <select id="appointmentSelect" required>
                            <option value="">Select Appointment</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Symptoms</label>
                        <textarea id="symptoms" rows="3" placeholder="Describe symptoms..."></textarea>
                    </div>
                    <div class="form-group">
                        <label>Diagnosis</label>
                        <textarea id="diagnosis" rows="3" placeholder="Enter diagnosis..."></textarea>
                    </div>
                    <div class="form-group">
                        <label>Treatment Plan</label>
                        <textarea id="treatment" rows="3" placeholder="Enter treatment plan..."></textarea>
                    </div>
                    <div class="form-group">
                        <label>Notes</label>
                        <textarea id="notes" rows="2" placeholder="Additional notes..."></textarea>
                    </div>
                    <button type="submit" class="btn btn--primary">Save Consultation</button>
                </form>
            </div>
        </main>
    </div>

    <script type="module" src="/src/js/doctor.js"></script>
</body>
    </html>
