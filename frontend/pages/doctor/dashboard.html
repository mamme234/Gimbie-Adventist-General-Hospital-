<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Doctor Dashboard - Gimbie Adventist General Hospital</title>
    <link rel="icon" href="/assets/images/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="/src/css/style.css" />
    <link rel="stylesheet" href="/src/css/doctor.css" />
    <link rel="stylesheet" href="/src/css/responsive.css" />
</head>
<body>
    <div class="doctor-wrapper">
        <!-- Sidebar -->
        <aside class="doctor-sidebar">
            <div class="profile-section">
                <div class="avatar" id="doctorAvatar">D</div>
                <div class="name" id="doctorName">Dr. Name</div>
                <div class="specialty" id="doctorSpecialty">Specialty</div>
            </div>
            <nav class="doctor-sidebar__nav">
                <ul>
                    <li><a href="/pages/doctor/dashboard.html" class="active"><i class="fas fa-th-large"></i> Dashboard</a></li>
                    <li><a href="/pages/doctor/appointments.html"><i class="fas fa-calendar-check"></i> Appointments</a></li>
                    <li><a href="/pages/doctor/patients.html"><i class="fas fa-users"></i> Patients</a></li>
                    <li><a href="/pages/doctor/consultations.html"><i class="fas fa-stethoscope"></i> Consultations</a></li>
                    <li><a href="/pages/doctor/prescriptions.html"><i class="fas fa-prescription-bottle"></i> Prescriptions</a></li>
                    <li><a href="/pages/doctor/lab-requests.html"><i class="fas fa-microscope"></i> Lab Requests</a></li>
                    <li><a href="/pages/doctor/profile.html"><i class="fas fa-user"></i> Profile</a></li>
                    <li class="logout-li">
                        <a href="#" id="sidebarLogoutBtn"><i class="fas fa-sign-out-alt"></i> Logout</a>
                    </li>
                </ul>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="doctor-main">
            <!-- Top Bar -->
            <div class="doctor-topbar">
                <div class="doctor-topbar__title">
                    <h1>Dashboard</h1>
                    <p>Welcome back, <span id="welcomeName">Doctor</span></p>
                </div>
                <div class="doctor-topbar__actions">
                    <div class="user-profile" id="userProfile">
                        <div class="avatar" id="doctorAvatarSmall">D</div>
                        <span class="name" id="userName">Doctor</span>
                        <i class="fas fa-chevron-down dropdown-icon"></i>
                        <div class="user-dropdown" id="userDropdown">
                            <a href="/pages/doctor/profile.html"><i class="fas fa-user"></i> Profile</a>
                            <a href="/pages/doctor/appointments.html"><i class="fas fa-calendar-check"></i> Appointments</a>
                            <hr />
                            <a href="#" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Logout</a>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Stats Cards -->
            <div class="doctor-stats" id="doctorStats">
                <!-- Loaded from JS -->
            </div>

            <!-- Today's Appointments -->
            <div class="doctor-appointments">
                <div class="header">
                    <h3>Today's Appointments</h3>
                    <a href="/pages/doctor/appointments.html" class="btn btn--small btn--outline">View All</a>
                </div>
                <div id="appointmentsList">
                    <!-- Loaded from JS -->
                </div>
            </div>
        </main>
    </div>

    <script type="module" src="/src/js/doctor.js"></script>
</body>
</html>
