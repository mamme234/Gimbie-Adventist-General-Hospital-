<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lab Requests - Doctor - Gimbie Adventist General Hospital</title>
    <link rel="icon" href="/assets/images/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="/src/css/style.css" />
    <link rel="stylesheet" href="/src/css/doctor.css" />
    <link rel="stylesheet" href="/src/css/responsive.css" />
</head>
<body>
    <div class="doctor-wrapper">
        <aside class="doctor-sidebar">
            <div class="profile-section">
                <div class="avatar" id="doctorAvatar">D</div>
                <div class="name" id="doctorName">Dr. Name</div>
                <div class="specialty" id="doctorSpecialty">Specialty</div>
            </div>
            <nav class="doctor-sidebar__nav">
                <ul>
                    <li><a href="/pages/doctor/dashboard.html"><i class="fas fa-th-large"></i> Dashboard</a></li>
                    <li><a href="/pages/doctor/appointments.html"><i class="fas fa-calendar-check"></i> Appointments</a></li>
                    <li><a href="/pages/doctor/patients.html"><i class="fas fa-users"></i> Patients</a></li>
                    <li><a href="/pages/doctor/consultations.html"><i class="fas fa-stethoscope"></i> Consultations</a></li>
                    <li><a href="/pages/doctor/prescriptions.html"><i class="fas fa-prescription-bottle"></i> Prescriptions</a></li>
                    <li><a href="/pages/doctor/lab-requests.html" class="active"><i class="fas fa-microscope"></i> Lab Requests</a></li>
                    <li><a href="/pages/doctor/profile.html"><i class="fas fa-user"></i> Profile</a></li>
                    <li class="logout-li">
                        <a href="#" id="sidebarLogoutBtn"><i class="fas fa-sign-out-alt"></i> Logout</a>
                    </li>
                </ul>
            </nav>
        </aside>

        <main class="doctor-main">
            <div class="doctor-topbar">
                <div class="doctor-topbar__title">
                    <h1>Lab Requests</h1>
                    <p>Request laboratory tests for patients</p>
                </div>
                <div class="doctor-topbar__actions">
                    <div class="user-profile" id="userProfile">
                        <div class="avatar" id="doctorAvatarSmall">D</div>
                        <span class="name" id="userName">Doctor</span>
                        <i class="fas fa-chevron-down dropdown-icon"></i>
                        <div class="user-dropdown" id="userDropdown">
                            <a href="/pages/doctor/profile.html"><i class="fas fa-user"></i> Profile</a>
                            <a href="/pages/doctor/appointments.html"><i class="fas fa-calendar-check"></i> Appointments</a>
                            <hr />
                            <a href="#" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Logout</a>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Lab Request Form -->
            <div class="lab-request-form">
                <h3>New Lab Request</h3>
                <form id="labRequestForm">
                    <div class="form-group">
                        <label>Patient</label>
                        <select id="patientSelect" required>
                            <option value="">Select Patient</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Test Name</label>
                        <input type="text" id="testName" placeholder="Enter test name" required />
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Category</label>
                            <select id="testCategory" required>
                                <option value="">Select Category</option>
                                <option value="Hematology">Hematology</option>
                                <option value="Biochemistry">Biochemistry</option>
                                <option value="Microbiology">Microbiology</option>
                                <option value="Serology">Serology</option>
                                <option value="Urinalysis">Urinalysis</option>
                                <option value="Immunology">Immunology</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Sample Type</label>
                            <select id="sampleType" required>
                                <option value="">Select Sample Type</option>
                                <option value="Blood">Blood</option>
                                <option value="Urine">Urine</option>
                                <option value="Stool">Stool</option>
                                <option value="CSF">CSF</option>
                                <option value="Sputum">Sputum</option>
                                <option value="Tissue">Tissue</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Priority</label>
                            <select id="priority">
                                <option value="Routine">Routine</option>
                                <option value="Urgent">Urgent</option>
                                <option value="Emergency">Emergency</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Clinical Notes</label>
                            <input type="text" id="clinicalNotes" placeholder="Clinical notes..." />
                        </div>
                    </div>
                    <button type="submit" class="btn btn--primary">Submit Lab Request</button>
                </form>
            </div>

            <!-- Lab Requests List -->
            <div class="lab-requests-list">
                <h3>Recent Lab Requests</h3>
                <div id="labRequestsList">
                    <!-- Loaded from JS -->
                </div>
            </div>
        </main>
    </div>

    <script type="module" src="/src/js/doctor.js"></script>
</body>
                                                               </html>
