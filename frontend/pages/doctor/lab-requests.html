<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lab Requests - Doctor - Gimbie Adventist General Hospital</title>
    <link rel="icon" href="/assets/images/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="/src/css/style.css" />
    <link rel="stylesheet" href="/src/css/doctor.css" />
    <link rel="stylesheet" href="/src/css/responsive.css" />
</head>
<body>
    <div class="doctor-wrapper">
        <aside class="doctor-sidebar" id="doctorSidebar">
            <div class="profile-section">
                <div class="avatar">D</div>
                <div class="name">Dr. Name</div>
                <div class="specialty">Specialty</div>
            </div>
            <nav class="doctor-sidebar__nav">
                <ul>
                    <li><a href="/pages/doctor/dashboard.html"><i class="fas fa-th-large"></i> Dashboard</a></li>
                    <li><a href="/pages/doctor/appointments.html"><i class="fas fa-calendar-check"></i> Appointments</a></li>
                    <li><a href="/pages/doctor/patients.html"><i class="fas fa-users"></i> Patients</a></li>
                    <li><a href="/pages/doctor/consultations.html"><i class="fas fa-stethoscope"></i> Consultations</a></li>
                    <li><a href="/pages/doctor/prescriptions.html"><i class="fas fa-prescription"></i> Prescriptions</a></li>
                    <li><a href="/pages/doctor/lab-requests.html" class="active"><i class="fas fa-microscope"></i> Lab Requests</a></li>
                    <li><a href="/pages/doctor/profile.html"><i class="fas fa-user"></i> Profile</a></li>
                </ul>
            </nav>
        </aside>

        <main class="doctor-main">
            <div class="doctor-topbar">
                <div class="admin-topbar__title">
                    <h1>Lab Requests</h1>
                    <p>Request laboratory tests</p>
                </div>
            </div>

            <div style="background: #fff; padding: 24px; border-radius: var(--radius); box-shadow: var(--shadow);">
                <h3 style="margin-bottom: 16px;">New Lab Request</h3>
                <form id="labRequestForm">
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                        <div class="form-group">
                            <label>Patient</label>
                            <select required>
                                <option value="">Select Patient</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Test Name</label>
                            <input type="text" placeholder="Enter test name" required />
                        </div>
                    </div>
                    <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px;">
                        <div class="form-group">
                            <label>Category</label>
                            <select required>
                                <option value="">Select Category</option>
                                <option value="Hematology">Hematology</option>
                                <option value="Biochemistry">Biochemistry</option>
                                <option value="Microbiology">Microbiology</option>
                                <option value="Serology">Serology</option>
                                <option value="Urinalysis">Urinalysis</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Sample Type</label>
                            <select required>
                                <option value="">Select Sample Type</option>
                                <option value="Blood">Blood</option>
                                <option value="Urine">Urine</option>
                                <option value="Stool">Stool</option>
                                <option value="CSF">CSF</option>
                                <option value="Sputum">Sputum</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Priority</label>
                            <select>
                                <option value="Routine">Routine</option>
                                <option value="Urgent">Urgent</option>
                                <option value="Emergency">Emergency</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Clinical Notes</label>
                        <textarea rows="2" placeholder="Enter clinical notes..."></textarea>
                    </div>
                    <button type="submit" class="btn btn--primary">Submit Lab Request</button>
                </form>
            </div>
        </main>
    </div>

    <script type="module">
        import { createLabRequest } from '/src/js/doctor.js';
        document.getElementById('labRequestForm')?.addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            await createLabRequest(Object.fromEntries(formData));
        });
    </script>
</body>
                          </html>
