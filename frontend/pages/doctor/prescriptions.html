<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prescriptions - Doctor - Gimbie Adventist General Hospital</title>
    <link rel="icon" href="/assets/images/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="/src/css/style.css" />
    <link rel="stylesheet" href="/src/css/doctor.css" />
    <link rel="stylesheet" href="/src/css/responsive.css" />
</head>
<body>
    <div class="doctor-wrapper">
        <aside class="doctor-sidebar">
            <div class="profile-section">
                <div class="avatar" id="doctorAvatar">D</div>
                <div class="name" id="doctorName">Dr. Name</div>
                <div class="specialty" id="doctorSpecialty">Specialty</div>
            </div>
            <nav class="doctor-sidebar__nav">
                <ul>
                    <li><a href="/pages/doctor/dashboard.html"><i class="fas fa-th-large"></i> Dashboard</a></li>
                    <li><a href="/pages/doctor/appointments.html"><i class="fas fa-calendar-check"></i> Appointments</a></li>
                    <li><a href="/pages/doctor/patients.html"><i class="fas fa-users"></i> Patients</a></li>
                    <li><a href="/pages/doctor/consultations.html"><i class="fas fa-stethoscope"></i> Consultations</a></li>
                    <li><a href="/pages/doctor/prescriptions.html" class="active"><i class="fas fa-prescription-bottle"></i> Prescriptions</a></li>
                    <li><a href="/pages/doctor/lab-requests.html"><i class="fas fa-microscope"></i> Lab Requests</a></li>
                    <li><a href="/pages/doctor/profile.html"><i class="fas fa-user"></i> Profile</a></li>
                    <li class="logout-li">
                        <a href="#" id="sidebarLogoutBtn"><i class="fas fa-sign-out-alt"></i> Logout</a>
                    </li>
                </ul>
            </nav>
        </aside>

        <main class="doctor-main">
            <div class="doctor-topbar">
                <div class="doctor-topbar__title">
                    <h1>Prescriptions</h1>
                    <p>Create and manage prescriptions</p>
                </div>
                <div class="doctor-topbar__actions">
                    <div class="user-profile" id="userProfile">
                        <div class="avatar" id="doctorAvatarSmall">D</div>
                        <span class="name" id="userName">Doctor</span>
                        <i class="fas fa-chevron-down dropdown-icon"></i>
                        <div class="user-dropdown" id="userDropdown">
                            <a href="/pages/doctor/profile.html"><i class="fas fa-user"></i> Profile</a>
                            <a href="/pages/doctor/appointments.html"><i class="fas fa-calendar-check"></i> Appointments</a>
                            <hr />
                            <a href="#" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Logout</a>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Prescription Form -->
            <div class="prescription-form">
                <h3>New Prescription</h3>
                <form id="prescriptionForm">
                    <div class="form-group">
                        <label>Patient</label>
                        <select id="patientSelect" required>
                            <option value="">Select Patient</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Medication</label>
                        <input type="text" id="medicationName" placeholder="Enter medication name" required />
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Dosage</label>
                            <input type="text" id="dosage" placeholder="e.g., 500mg" required />
                        </div>
                        <div class="form-group">
                            <label>Frequency</label>
                            <input type="text" id="frequency" placeholder="e.g., Twice daily" required />
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Duration</label>
                            <input type="text" id="duration" placeholder="e.g., 7 days" required />
                        </div>
                        <div class="form-group">
                            <label>Quantity</label>
                            <input type="number" id="quantity" placeholder="e.g., 14" required />
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Instructions</label>
                        <textarea id="instructions" rows="2" placeholder="Additional instructions..."></textarea>
                    </div>
                    <button type="submit" class="btn btn--primary">Create Prescription</button>
                </form>
            </div>

            <!-- Prescriptions List -->
            <div class="prescriptions-list">
                <h3>Recent Prescriptions</h3>
                <div id="prescriptionsList">
                    <!-- Loaded from JS -->
                </div>
            </div>
        </main>
    </div>

    <script type="module" src="/src/js/doctor.js"></script>
</body>
    </html>
