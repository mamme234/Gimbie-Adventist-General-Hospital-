<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile - Doctor - Gimbie Adventist General Hospital</title>
    <link rel="icon" href="/assets/images/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="/src/css/style.css" />
    <link rel="stylesheet" href="/src/css/doctor.css" />
    <link rel="stylesheet" href="/src/css/responsive.css" />
</head>
<body>
    <div class="doctor-wrapper">
        <aside class="doctor-sidebar" id="doctorSidebar">
            <div class="profile-section">
                <div class="avatar">D</div>
                <div class="name">Dr. Name</div>
                <div class="specialty">Specialty</div>
            </div>
            <nav class="doctor-sidebar__nav">
                <ul>
                    <li><a href="/pages/doctor/dashboard.html"><i class="fas fa-th-large"></i> Dashboard</a></li>
                    <li><a href="/pages/doctor/appointments.html"><i class="fas fa-calendar-check"></i> Appointments</a></li>
                    <li><a href="/pages/doctor/patients.html"><i class="fas fa-users"></i> Patients</a></li>
                    <li><a href="/pages/doctor/consultations.html"><i class="fas fa-stethoscope"></i> Consultations</a></li>
                    <li><a href="/pages/doctor/prescriptions.html"><i class="fas fa-prescription"></i> Prescriptions</a></li>
                    <li><a href="/pages/doctor/lab-requests.html"><i class="fas fa-microscope"></i> Lab Requests</a></li>
                    <li><a href="/pages/doctor/profile.html" class="active"><i class="fas fa-user"></i> Profile</a></li>
                </ul>
            </nav>
        </aside>

        <main class="doctor-main">
            <div class="doctor-topbar">
                <div class="admin-topbar__title">
                    <h1>My Profile</h1>
                    <p>View and update your profile</p>
                </div>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 2fr; gap: 24px;">
                <!-- Profile Card -->
                <div style="background: #fff; padding: 24px; border-radius: var(--radius); box-shadow: var(--shadow); text-align: center;">
                    <div class="avatar" style="width: 100px; height: 100px; border-radius: 50%; background: var(--primary); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 2.5rem; font-weight: 700; margin: 0 auto 16px;">D</div>
                    <h2 id="profileName">Dr. Name</h2>
                    <p style="color: var(--text-secondary);" id="profileSpecialty">Specialty</p>
                    <p style="color: var(--text-secondary); font-size: 0.9rem;" id="profileDepartment">Department</p>
                    <hr style="margin: 16px 0;" />
                    <p><strong>License:</strong> <span id="profileLicense">N/A</span></p>
                    <p><strong>Experience:</strong> <span id="profileExperience">0</span> years</p>
                    <p><strong>Patients:</strong> <span id="profilePatients">0</span></p>
                    <button class="btn btn--primary" style="margin-top: 16px;" onclick="document.getElementById('editProfile').style.display='block'">Edit Profile</button>
                </div>

                <!-- Edit Form -->
                <div style="background: #fff; padding: 24px; border-radius: var(--radius); box-shadow: var(--shadow);" id="editProfile">
                    <h3 style="margin-bottom: 16px;">Edit Profile</h3>
                    <form id="profileForm">
                        <div class="form-group">
                            <label>Full Name</label>
                            <input type="text" id="editName" class="form-control" />
                        </div>
                        <div class="form-group">
                            <label>Email</label>
                            <input type="email" id="editEmail" class="form-control" />
                        </div>
                        <div class="form-group">
                            <label>Phone</label>
                            <input type="tel" id="editPhone" class="form-control" />
                        </div>
                        <div class="form-group">
                            <label>Specialty</label>
                            <input type="text" id="editSpecialty" class="form-control" />
                        </div>
                        <div class="form-group">
                            <label>Department</label>
                            <select id="editDepartment" class="form-control">
                                <option value="Internal Medicine">Internal Medicine</option>
                                <option value="Pediatrics">Pediatrics</option>
                                <option value="Surgery">Surgery</option>
                                <option value="Obstetrics & Gynecology">Obstetrics & Gynecology</option>
                                <option value="Emergency">Emergency</option>
                                <option value="Family Medicine">Family Medicine</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn--primary">Save Changes</button>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <script type="module">
        import API from '/src/js/api.js';
        import { updateProfile } from '/src/js/auth.js';

        document.addEventListener('DOMContentLoaded', async () => {
            const user = API.getCurrentUser();
            if (user) {
                document.getElementById('profileName').textContent = user.fullName || 'Dr. Name';
                document.getElementById('profileSpecialty').textContent = user.specialty || 'Specialty';
                document.getElementById('profileDepartment').textContent = user.department || 'Department';
                
                document.getElementById('editName').value = user.fullName || '';
                document.getElementById('editEmail').value = user.email || '';
                document.getElementById('editPhone').value = user.phone || '';
                document.getElementById('editSpecialty').value = user.specialty || '';
                document.getElementById('editDepartment').value = user.department || '';
            }
        });

        document.getElementById('profileForm')?.addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const data = {
                fullName: formData.get('fullName'),
                email: formData.get('email'),
                phone: formData.get('phone'),
                specialty: formData.get('specialty'),
                department: formData.get('department'),
            };
            await updateProfile(data);
        });
    </script>
</body>
  </html>
