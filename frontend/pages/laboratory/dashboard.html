<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Laboratory Dashboard - Gimbie Adventist General Hospital</title>
    <link rel="icon" href="/assets/images/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="/src/css/style.css" />
    <link rel="stylesheet" href="/src/css/laboratory.css" />
    <link rel="stylesheet" href="/src/css/responsive.css" />
</head>
<body>
    <div class="lab-wrapper">
        <!-- Sidebar -->
        <aside class="lab-sidebar" id="labSidebar">
            <div class="logo" style="padding: 0 20px 20px; border-bottom: 1px solid #e8edea; margin-bottom: 16px;">
                <a href="/pages/laboratory/dashboard.html">
                    <img src="/assets/images/logo.png" alt="Gimbie Adventist" class="logo__img" style="height: 36px;" />
                    <div class="logo__text">
                        <span class="logo__name" style="font-size: 0.95rem;">Gimbie Adventist</span>
                        <span class="logo__tag" style="font-size: 0.65rem;">Laboratory</span>
                    </div>
                </a>
            </div>
            <nav class="lab-sidebar__nav">
                <ul>
                    <li><a href="/pages/laboratory/dashboard.html" class="active"><i class="fas fa-th-large"></i> Dashboard</a></li>
                    <li><a href="/pages/laboratory/tests.html"><i class="fas fa-flask"></i> Tests</a></li>
                    <li><a href="/pages/laboratory/results.html"><i class="fas fa-file-medical-alt"></i> Results</a></li>
                    <li><a href="/pages/laboratory/reports.html"><i class="fas fa-chart-bar"></i> Reports</a></li>
                </ul>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="lab-main">
            <div class="doctor-topbar">
                <div class="admin-topbar__title">
                    <h1>Laboratory Dashboard</h1>
                    <p>Welcome back, Lab Technician</p>
                </div>
                <div class="admin-topbar__actions">
                    <div class="user-profile">
                        <div class="avatar" style="background: #1565c0; color: #fff;">L</div>
                    </div>
                </div>
            </div>

            <!-- Stats -->
            <div class="test-stats" id="labStats">
                <!-- Loaded from JS -->
            </div>

            <!-- Pending Tests -->
            <div style="background: #fff; border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px; margin-bottom: 24px;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                    <h3>Pending Tests</h3>
                    <a href="/pages/laboratory/tests.html" class="btn btn--small btn--outline">View All</a>
                </div>
                <div id="pendingTests">
                    <!-- Loaded from JS -->
                </div>
            </div>

            <!-- Today's Tests -->
            <div style="background: #fff; border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                    <h3>Today's Tests</h3>
                    <a href="/pages/laboratory/tests.html" class="btn btn--small btn--outline">View All</a>
                </div>
                <div id="todayTests">
                    <!-- Loaded from JS -->
                </div>
            </div>
        </main>
    </div>

    <script type="module" src="/src/js/laboratory.js"></script>
</body>
  </html>
