<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Gimbie Adventist General Hospital</title>
    <link rel="icon" href="/assets/images/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="/src/css/style.css" />
    <link rel="stylesheet" href="/src/css/responsive.css" />
</head>
<body style="background: var(--bg-light);">

<!-- ===== LOGIN CONTAINER ===== -->
<div class="auth-container" style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 40px 20px;">
    <div class="auth-card" style="background: #fff; border-radius: var(--radius-lg); padding: 48px; max-width: 440px; width: 100%; box-shadow: var(--shadow-hover);">
        <div style="text-align: center; margin-bottom: 32px;">
            <img src="/assets/images/logo.png" alt="Gimbie Adventist General Hospital" style="height: 60px; margin-bottom: 16px;" />
            <h1 style="font-size: 1.5rem; font-weight: 700;">Welcome Back</h1>
            <p style="color: var(--text-secondary);">Login to your account</p>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required placeholder="Enter your email" />
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required placeholder="Enter your password" />
            </div>
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <label style="display: flex; align-items: center; gap: 8px; font-size: 0.9rem; color: var(--text-secondary);">
                    <input type="checkbox" /> Remember me
                </label>
                <a href="/pages/forgot-password.html" style="font-size: 0.9rem; color: var(--primary);">Forgot Password?</a>
            </div>
            <button type="submit" class="btn btn--primary btn--full" style="padding: 14px;">Login</button>
        </form>

        <div style="text-align: center; margin-top: 24px; color: var(--text-secondary);">
            Don't have an account? <a href="/pages/register.html" style="color: var(--primary); font-weight: 600;">Register</a>
        </div>
    </div>
</div>

<script type="module" src="/src/js/auth.js"></script>
</body>
</html>
