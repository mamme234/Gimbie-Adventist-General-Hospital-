<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nurse Dashboard - Gimbie Adventist General Hospital</title>
    <link rel="icon" href="/assets/images/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="/src/css/style.css" />
    <link rel="stylesheet" href="/src/css/nurse.css" />
    <link rel="stylesheet" href="/src/css/responsive.css" />
</head>
<body>
    <div class="nurse-wrapper">
        <!-- Sidebar -->
        <aside class="nurse-sidebar" id="nurseSidebar">
            <div class="profile-section">
                <div class="avatar" id="nurseAvatar">N</div>
                <div class="name" id="nurseName">Nurse Name</div>
                <div class="specialty" id="nurseWard">Ward</div>
            </div>
            <nav class="nurse-sidebar__nav">
                <ul>
                    <li><a href="/pages/nurse/dashboard.html" class="active"><i class="fas fa-th-large"></i> Dashboard</a></li>
                    <li><a href="/pages/nurse/patients.html"><i class="fas fa-users"></i> Patients</a></li>
                    <li><a href="/pages/nurse/vitals.html"><i class="fas fa-heartbeat"></i> Vitals</a></li>
                    <li><a href="/pages/nurse/medications.html"><i class="fas fa-syringe"></i> Medications</a></li>
                    <li><a href="/pages/nurse/wards.html"><i class="fas fa-bed"></i> Wards</a></li>
                </ul>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="nurse-main">
            <div class="doctor-topbar">
                <div class="admin-topbar__title">
                    <h1>Nurse Dashboard</h1>
                    <p>Welcome back, Nurse</p>
                </div>
                <div class="admin-topbar__actions">
                    <button class="notification-btn">
                        <i class="fas fa-bell"></i>
                        <span class="dot"></span>
                    </button>
                    <div class="user-profile">
                        <div class="avatar" id="nurseAvatarSmall">N</div>
                    </div>
                </div>
            </div>

            <!-- Stats -->
            <div class="nurse-stats" id="nurseStats" style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 24px;">
                <!-- Loaded from JS -->
            </div>

            <!-- Assigned Patients -->
            <div style="background: #fff; border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                    <h3>Assigned Patients</h3>
                    <a href="/pages/nurse/patients.html" class="btn btn--small btn--outline">View All</a>
                </div>
                <div id="patientsList" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px;">
                    <!-- Loaded from JS -->
                </div>
            </div>
        </main>
    </div>

    <script type="module" src="/src/js/nurse.js"></script>
</body>
  </html>
