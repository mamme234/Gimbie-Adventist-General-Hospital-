<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vitals - Nurse - Gimbie Adventist General Hospital</title>
    <link rel="icon" href="/assets/images/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="/src/css/style.css" />
    <link rel="stylesheet" href="/src/css/nurse.css" />
    <link rel="stylesheet" href="/src/css/responsive.css" />
</head>
<body>
    <div class="nurse-wrapper">
        <aside class="nurse-sidebar" id="nurseSidebar">
            <div class="profile-section">
                <div class="avatar">N</div>
                <div class="name">Nurse Name</div>
                <div class="specialty">Ward</div>
            </div>
            <nav class="nurse-sidebar__nav">
                <ul>
                    <li><a href="/pages/nurse/dashboard.html"><i class="fas fa-th-large"></i> Dashboard</a></li>
                    <li><a href="/pages/nurse/patients.html"><i class="fas fa-users"></i> Patients</a></li>
                    <li><a href="/pages/nurse/vitals.html" class="active"><i class="fas fa-heartbeat"></i> Vitals</a></li>
                    <li><a href="/pages/nurse/medications.html"><i class="fas fa-syringe"></i> Medications</a></li>
                    <li><a href="/pages/nurse/wards.html"><i class="fas fa-bed"></i> Wards</a></li>
                </ul>
            </nav>
        </aside>

        <main class="nurse-main">
            <div class="doctor-topbar">
                <div class="admin-topbar__title">
                    <h1>Vital Signs</h1>
                    <p>Record and monitor patient vitals</p>
                </div>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 24px;">
                <!-- Vitals Form -->
                <div style="background: #fff; padding: 24px; border-radius: var(--radius); box-shadow: var(--shadow);">
                    <h3 style="margin-bottom: 16px;">Record Vitals</h3>
                    <form id="vitalsForm">
                        <div class="form-group">
                            <label>Patient</label>
                            <select id="vitalPatient" required>
                                <option value="">Select Patient</option>
                            </select>
                        </div>
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
                            <div class="form-group">
                                <label>Blood Pressure</label>
                                <input type="text" placeholder="120/80" required />
                            </div>
                            <div class="form-group">
                                <label>Heart Rate</label>
                                <input type="number" placeholder="72 bpm" required />
                            </div>
                        </div>
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
                            <div class="form-group">
                                <label>Temperature (°C)</label>
                                <input type="number" step="0.1" placeholder="37.0" required />
                            </div>
                            <div class="form-group">
                                <label>Respiratory Rate</label>
                                <input type="number" placeholder="16" required />
                            </div>
                        </div>
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
                            <div class="form-group">
                                <label>Oxygen Saturation (%)</label>
                                <input type="number" placeholder="98" required />
                            </div>
                            <div class="form-group">
                                <label>Weight (kg)</label>
                                <input type="number" step="0.1" placeholder="70" />
                            </div>
                        </div>
                        <div class="form-group">
                            <label>Notes</label>
                            <textarea rows="2" placeholder="Additional observations..."></textarea>
                        </div>
                        <button type="submit" class="btn btn--primary">Save Vitals</button>
                    </form>
                </div>

                <!-- Recent Vitals -->
                <div style="background: #fff; padding: 24px; border-radius: var(--radius); box-shadow: var(--shadow);">
                    <h3 style="margin-bottom: 16px;">Recent Vitals</h3>
                    <div id="recentVitals">
                        <div style="text-align: center; padding: 40px; color: var(--text-secondary);">
                            <i class="fas fa-heartbeat" style="font-size: 2rem; display: block; margin-bottom: 8px;"></i>
                            No vitals recorded yet
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script type="module">
        import { saveVitals } from '/src/js/nurse.js';
        document.getElementById('vitalsForm')?.addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            await saveVitals(Object.fromEntries(formData));
        });
    </script>
</body>
  </html>
