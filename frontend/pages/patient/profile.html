<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile - Patient - Gimbie Adventist General Hospital</title>
    <link rel="icon" href="/assets/images/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="/src/css/style.css" />
    <link rel="stylesheet" href="/src/css/patient.css" />
    <link rel="stylesheet" href="/src/css/responsive.css" />
</head>
<body>
    <div class="patient-wrapper">
        <aside class="patient-sidebar" id="patientSidebar">
            <div class="profile-section">
                <div class="avatar">P</div>
                <div class="name">Patient Name</div>
                <div class="patient-id">ID: N/A</div>
            </div>
            <nav class="patient-sidebar__nav">
                <ul>
                    <li><a href="/pages/patient/dashboard.html"><i class="fas fa-th-large"></i> Dashboard</a></li>
                    <li><a href="/pages/patient/appointments.html"><i class="fas fa-calendar-check"></i> Appointments</a></li>
                    <li><a href="/pages/patient/medical-records.html"><i class="fas fa-file-medical"></i> Medical Records</a></li>
                    <li><a href="/pages/patient/lab-results.html"><i class="fas fa-microscope"></i> Lab Results</a></li>
                    <li><a href="/pages/patient/prescriptions.html"><i class="fas fa-prescription"></i> Prescriptions</a></li>
                    <li><a href="/pages/patient/billing.html"><i class="fas fa-file-invoice-dollar"></i> Billing</a></li>
                    <li><a href="/pages/patient/profile.html" class="active"><i class="fas fa-user"></i> Profile</a></li>
                </ul>
            </nav>
        </aside>

        <main class="patient-main">
            <div class="doctor-topbar">
                <div class="admin-topbar__title">
                    <h1>My Profile</h1>
                    <p>View and update your personal information</p>
                </div>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 2fr; gap: 24px;">
                <!-- Profile Card -->
                <div style="background: #fff; padding: 24px; border-radius: var(--radius); box-shadow: var(--shadow); text-align: center;">
                    <div class="avatar" style="width: 100px; height: 100px; border-radius: 50%; background: var(--info); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 2.5rem; font-weight: 700; margin: 0 auto 16px;">P</div>
                    <h2 id="profileName">Patient Name</h2>
                    <p style="color: var(--text-secondary);" id="profileId">ID: N/A</p>
                    <hr style="margin: 16px 0;" />
                    <p><strong>Phone:</strong> <span id="profilePhone">N/A</span></p>
                    <p><strong>Email:</strong> <span id="profileEmail">N/A</span></p>
                    <p><strong>Blood Group:</strong> <span id="profileBlood">Unknown</span></p>
                    <p><strong>Age:</strong> <span id="profileAge">N/A</span></p>
                    <button class="btn btn--primary" style="margin-top: 16px;" onclick="document.getElementById('editProfile').style.display='block'">Edit Profile</button>
                </div>

                <!-- Edit Form -->
                <div style="background: #fff; padding: 24px; border-radius: var(--radius); box-shadow: var(--shadow);" id="editProfile">
                    <h3 style="margin-bottom: 16px;">Edit Profile</h3>
                    <form id="profileForm">
                        <div class="form-group">
                            <label>Full Name</label>
                            <input type="text" id="editName" class="form-control" />
                        </div>
                        <div class="form-group">
                            <label>Email</label>
                            <input type="email" id="editEmail" class="form-control" />
                        </div>
                        <div class="form-group">
                            <label>Phone</label>
                            <input type="tel" id="editPhone" class="form-control" />
                        </div>
                        <div class="form-group">
                            <label>Date of Birth</label>
                            <input type="date" id="editDob" class="form-control" />
                        </div>
                        <div class="form-group">
                            <label>Blood Group</label>
                            <select id="editBlood" class="form-control">
                                <option value="Unknown">Unknown</option>
                                <option value="A+">A+</option>
                                <option value="A-">A-</option>
                                <option value="B+">B+</option>
                                <option value="B-">B-</option>
                                <option value="AB+">AB+</option>
                                <option value="AB-">AB-</option>
                                <option value="O+">O+</option>
                                <option value="O-">O-</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn--primary">Save Changes</button>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <script type="module">
        import API from '/src/js/api.js';
        import { updateProfile } from '/src/js/auth.js';

        document.addEventListener('DOMContentLoaded', async () => {
            const user = API.getCurrentUser();
            if (user) {
                document.getElementById('profileName').textContent = user.fullName || 'Patient Name';
                document.getElementById('profileId').textContent = `ID: ${user.patientId || 'N/A'}`;
                document.getElementById('profilePhone').textContent = user.phone || 'N/A';
                document.getElementById('profileEmail').textContent = user.email || 'N/A';
                document.getElementById('profileBlood').textContent = user.bloodGroup || 'Unknown';
                
                document.getElementById('editName').value = user.fullName || '';
                document.getElementById('editEmail').value = user.email || '';
                document.getElementById('editPhone').value = user.phone || '';
                document.getElementById('editDob').value = user.dob || '';
                document.getElementById('editBlood').value = user.bloodGroup || 'Unknown';
            }
        });

        document.getElementById('profileForm')?.addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const data = {
                fullName: formData.get('fullName'),
                email: formData.get('email'),
                phone: formData.get('phone'),
                dob: formData.get('dob'),
                bloodGroup: formData.get('bloodGroup'),
            };
            await updateProfile(data);
        });
    </script>
</body>
</html>
