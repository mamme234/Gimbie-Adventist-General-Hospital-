<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password - Gimbie Adventist General Hospital</title>
    <link rel="icon" href="/assets/images/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="/src/css/style.css" />
    <link rel="stylesheet" href="/src/css/responsive.css" />
</head>
<body style="background: var(--bg-light);">

<!-- ===== RESET PASSWORD CONTAINER ===== -->
<div class="auth-container" style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 40px 20px;">
    <div class="auth-card" style="background: #fff; border-radius: var(--radius-lg); padding: 48px; max-width: 440px; width: 100%; box-shadow: var(--shadow-hover);">
        <div style="text-align: center; margin-bottom: 32px;">
            <img src="/assets/images/logo.png" alt="Gimbie Adventist General Hospital" style="height: 60px; margin-bottom: 16px;" />
            <h1 style="font-size: 1.5rem; font-weight: 700;">Reset Password</h1>
            <p style="color: var(--text-secondary);">Create a new password for your account</p>
        </div>

        <form id="resetPasswordForm">
            <div class="form-group">
                <label for="newPassword">New Password</label>
                <input type="password" id="newPassword" name="newPassword" required placeholder="Create a new password (min 6 characters)" />
            </div>
            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" name="confirmPassword" required placeholder="Confirm your new password" />
            </div>
            <button type="submit" class="btn btn--primary btn--full" style="padding: 14px;">
                <i class="fas fa-check"></i> Reset Password
            </button>
        </form>

        <div style="text-align: center; margin-top: 24px; color: var(--text-secondary);">
            <a href="/pages/login.html" style="color: var(--primary); font-weight: 600;">
                <i class="fas fa-arrow-left"></i> Back to Login
            </a>
        </div>
    </div>
</div>

<script type="module" src="/src/js/auth.js"></script>
</body>
</html>
